name: VM7 Default Transition Environment Consumer 261017B
on:
  push:
    branches:
      - 'vm7-default-target-261017a'
permissions:
  contents: read
jobs:
  consume:
    runs-on: ubuntu-latest
    environment: vm7-default-transition-env-261017b
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixed protected hook
        env:
          VM7_DEFAULT_TRANSITION_SECRET_261017B: ${{ secrets.VM7_DEFAULT_TRANSITION_SECRET_261017B }}
        run: bash target-guard.sh
      - name: Preserve controlled proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm7-default-transition-proof-261017b
          path: vm7-default-transition-proof.bin
          if-no-files-found: error
          retention-days: 1
